; Firmware StageWatch pour LilyGO T-Watch S3
; Versions alignées sur le dépôt officiel LilyGO (branche t-watch-s3) : espressif32@6.3.0 = Arduino core 2.0.9
[platformio]
default_envs = twatch
boards_dir = boards

[env]
platform = espressif32@6.3.0
framework = arduino
board = LilyGoWatch-S3
board_build.partitions = app3M_fat9M_16MB.csv
upload_speed = 921600
monitor_speed = 115200
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    lewisxhe/XPowersLib @ 0.2.4
    lewisxhe/SensorLib @ 0.1.8
    links2004/WebSockets @ 2.4.1
    bblanchon/ArduinoJson @ 7.0.4
    https://github.com/Bodmer/U8g2_for_TFT_eSPI.git
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    -DDISABLE_ALL_LIBRARY_WARNINGS
    ; --- écran ST7789 240x240 (repris de Setup212_LilyGo_T_Watch_S3.h) ---
    -DUSER_SETUP_LOADED=1
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=240
    -DTFT_MISO=-1
    -DTFT_MOSI=13
    -DTFT_SCLK=18
    -DTFT_CS=12
    -DTFT_DC=38
    -DTFT_RST=-1
    -DTFT_INVERSION_ON=1
    -DLOAD_GLCD=1
    -DSPI_FREQUENCY=40000000

; Usage normal (sur batterie). Pas de logs USB : sinon la montre peut ne pas démarrer sans câble.
[env:twatch]

; Debug : logs sur le port USB (à utiliser câble branché uniquement)
[env:twatch-debug]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DSW_DEBUG=1
