<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>StageWatch · Public</title>
<style>
:root{--bg:#000;--card:#0d0d0f;--line:#232327;--fg:#fff;--mut:#8a8f98;--acc:#ffd23f}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;cursor:none}
/* 8 cases strictement identiques : 4 x 2 qui remplissent l'écran, quel que soit le contenu */
#grid{display:grid;height:100vh;padding:2.5vh 2vw;gap:2vh 1.5vw;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
.c{background:var(--card);border:3px solid var(--line);border-radius:2vh;padding:2vh 1.2vw;display:flex;flex-direction:column;gap:1.5vh;min-height:0;min-width:0;overflow:hidden;transition:border-color .5s,background .5s,box-shadow .5s}
.c .hd{display:flex;align-items:center;gap:1vw;min-width:0;flex:none}
.c .ph{width:9vh;height:9vh;border-radius:50%;flex:none;background:#222 center/cover;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:3.6vh;color:#666}
.c .n{font-size:3.2vh;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#d6d9de}
.c .m{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden}
.c.fresh{border-color:var(--acc);background:#1c1700;box-shadow:0 0 4vh #ffd23f40}
.c.fresh .n{color:var(--acc)}
.c.fresh .m{animation:pop .6s ease-out}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.05);opacity:1}100%{transform:scale(1)}}
#off{position:fixed;bottom:1vh;right:1vw;color:#f2555a;font-size:14px;display:none}
</style></head><body>
<div id="grid"></div><div id="off">connexion au serveur…</div>
<script src="/common.js"></script>
<script>
// Une case fixe par participant ; le dernier message reste affiché, la case s'allume à l'arrivée.
const FRESH_MS = 8000; let watches = [], fresh = {}, built = '';
connectWS('public', m => {
  if (m.type === 'state') { watches = m.watches; render() }
  if (m.type === 'message') { fresh[m.message.to] = Date.now(); render(m.message.to) }
}, on => document.getElementById('off').style.display = on ? 'none' : 'block');
const initials = n => n.split(/\s+/).filter(Boolean).slice(0, 2).map(x => x[0].toUpperCase()).join('');
function render(popId) {
  const g = document.getElementById('grid');
  const sig = watches.map(w => w.id).join(',');
  if (sig !== built) { // structure créée une fois, puis mise à jour en place (pas de saut visuel)
    g.innerHTML = watches.map(w => `<div class="c" data-id="${w.id}"><div class="hd"><div class="ph"></div><div class="n"></div></div><div class="m"><div class="tgrid"></div></div></div>`).join('');
    built = sig;
  }
  for (const w of watches) {
    const c = g.querySelector(`[data-id="${w.id}"]`), ph = c.querySelector('.ph'), m = c.querySelector('.m');
    c.querySelector('.n').textContent = w.name;
    ph.style.backgroundImage = w.photo ? `url('${w.photo}')` : ''; ph.textContent = w.photo ? '' : initials(w.name);
    const txt = w.last ? w.last.text : '';
    if (m.dataset.t !== txt) { m.dataset.t = txt; renderGrid(m.firstChild, txt) }
    c.classList.toggle('fresh', Date.now() - (fresh[w.id] || 0) < FRESH_MS);
    if (popId === w.id) { m.style.animation = 'none'; void m.offsetWidth; m.style.animation = '' }
  }
  sizeGrids();
}
// Même taille de caractère pour toutes les cases (proportions de l'écran de la montre : 19 x 27)
function sizeGrids() {
  const m = document.querySelector('.c .m'); if (!m) return;
  const cw = Math.floor(Math.min(m.clientWidth / 12, (m.clientHeight / 8) * 19 / 27));
  const g = document.getElementById('grid');
  g.style.setProperty('--cw', cw + 'px'); g.style.setProperty('--ch', Math.floor(cw * 27 / 19) + 'px'); g.style.setProperty('--fs', Math.floor(cw * 1.55) + 'px');
}
setInterval(() => document.querySelectorAll('.c.fresh').forEach(c => { if (Date.now() - (fresh[c.dataset.id] || 0) >= FRESH_MS) c.classList.remove('fresh') }), 500);
addEventListener('resize', sizeGrids);
addEventListener('dblclick', () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen());
</script></body></html>
